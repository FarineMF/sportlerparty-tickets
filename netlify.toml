[build]
  publish = "public"
  # public/vendor/tickets.bundle.js wird aus src/tickets.js gebaut (siehe scripts/build.mjs)
  command = "node scripts/build.mjs"
  functions = "netlify/functions"

[build.environment]
  # Die Scan-PIN ist kurz (z. B. 4 Ziffern) und taucht zufällig als Zahlenfolge im Programmcode auf.
  # Sie wird nie ausgeliefert – nur von der Geheimnis-Prüfung ausnehmen. Das Admin-Passwort wird weiter geprüft.
  SECRETS_SCAN_OMIT_KEYS = "TICKETS_SCAN_PIN"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/scan"
  to = "/scan.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; worker-src 'self' blob:"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
